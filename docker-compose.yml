services:
  postgres:
    image: postgres:18

    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}

    volumes:
      - postgres_data:/var/lib/postgresql
      - ./moneymonkey.sql:/docker-entrypoint-initdb.d/moneymonkey.sql:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d moneymonkey"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ../MoneyMonkey-Backend

    environment:
      PORT: 5000

      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}

      DB_HOST: postgres
      DB_PORT: 5432
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}

      MODEL_URL: http://model:5050

      FRONTEND_URL: ${FRONTEND_URL}

      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      JWT_REFRESH_EXPIRES_IN: ${JWT_REFRESH_EXPIRES_IN}

      NODE_ENV: ${NODE_ENV}

    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:5000/api/healty').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5

    depends_on:
      postgres:
        condition: service_healthy
      model:
        condition: service_healthy
    
  model:
    build:
      context: ../MoneyMonkey-Model

    environment:
      PORT: 5050

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5050/healty')"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ../MoneyMonkey-Frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_GOOGLE_CLIENT_ID: ${NEXT_PUBLIC_GOOGLE_CLIENT_ID}

  nginx:
    image: nginx:alpine

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /etc/letsencrypt:/etc/letsencrypt:ro
    
    depends_on:
      - frontend
      - backend

volumes:
  postgres_data: