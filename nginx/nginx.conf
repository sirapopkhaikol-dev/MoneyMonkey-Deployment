events {}

http {
    server {
        listen 80;
        server_name moneymonkey.trade www.moneymonkey.trade shop.moneymonkey.trade;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    server {
        listen 443 ssl;
        server_name moneymonkey.trade www.moneymonkey.trade;

        ssl_certificate /etc/letsencrypt/live/moneymonkey.trade/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/moneymonkey.trade/privkey.pem;

        location / {
            proxy_pass http://frontend:3000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://backend:5000;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }
    }
}